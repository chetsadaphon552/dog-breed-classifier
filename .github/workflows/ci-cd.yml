name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Run unit tests
      run: |
        pytest test_api.py -v --cov=api --cov-report=xml --cov-report=term
    
    - name: Test summary
      if: always()
      run: |
        echo "✅ Tests completed"

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Deploy API-only Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: chetsadaphon66/dog-breed-classifier
      run: |
        git clone https://huggingface:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE hf-space
        cd hf-space
        
        # Copy files for API-only deployment
        cp ../api.py .
        cp ../Dockerfile .
        cp ../requirements.txt .
        mkdir -p models
        cp ../models/resnet34_int8.onnx models/
        cp ../models/resnet34_dog_breeds.json models/
        
        # Update README for HF Space
        if [ -f ../HF_README.md ]; then
          cp ../HF_README.md README.md
        else
          echo "# Dog Breed Classification API" > README.md
          echo "" >> README.md
          echo "FastAPI service for dog breed classification using ONNX INT8 model." >> README.md
          echo "" >> README.md
          echo "## API Endpoints" >> README.md
          echo "- \`GET /\` - Health check" >> README.md
          echo "- \`GET /health\` - Detailed health status" >> README.md
          echo "- \`POST /predict\` - Predict dog breed" >> README.md
          echo "- \`GET /metrics\` - API metrics" >> README.md
          echo "- \`GET /docs\` - Swagger UI documentation" >> README.md
          echo "" >> README.md
          echo "## Usage" >> README.md
          echo "\`\`\`bash" >> README.md
          echo "curl -X POST \"https://chetsadaphon66-dog-breed-classifier.hf.space/predict\" \\" >> README.md
          echo "  -F \"file=@dog.jpg\"" >> README.md
          echo "\`\`\`" >> README.md
        fi
        
        # Commit and push
        git add .
        git commit -m "Auto-deploy API-only mode from GitHub Actions" || echo "No changes to commit"
        git push
    
    - name: Deployment summary
      run: |
        echo "✅ Deployed API-only space to https://huggingface.co/spaces/chetsadaphon66/dog-breed-classifier"
        echo "🚀 FastAPI: Port 7860"
        echo "📖 API Docs: https://chetsadaphon66-dog-breed-classifier.hf.space/docs"
        echo "📊 Metrics: https://chetsadaphon66-dog-breed-classifier.hf.space/metrics"
