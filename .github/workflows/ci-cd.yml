name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn python-multipart pydantic pillow numpy onnx onnxruntime pytest pytest-asyncio httpx
    
    - name: Run unit tests
      run: |
        pytest test_api.py -v
    
    - name: Test summary
      if: always()
      run: |
        echo "✅ Tests completed"

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Deploy to HF Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: chetsadaphon66/dog-breed-classifier
      run: |
        git clone https://chetsadaphon66:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE hf-space
        cd hf-space
        
        # Copy files
        cp ../api.py .
        cp ../Dockerfile .
        cp ../requirements.txt .
        mkdir -p models
        cp ../models/resnet34_int8.onnx models/
        cp ../models/resnet34_dog_breeds.json models/
        
        # Update README if exists
        if [ -f ../HF_README.md ]; then
          cp ../HF_README.md README.md
        fi
        
        # Commit and push
        git add .
        git commit -m "Auto-deploy from GitHub Actions" || echo "No changes to commit"
        git push
    
    - name: Deployment summary
      run: |
        echo "✅ Deployed to https://huggingface.co/spaces/chetsadaphon66/dog-breed-classifier"
