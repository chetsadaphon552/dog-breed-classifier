name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Run unit tests
      run: |
        pytest test_api.py -v --cov=api --cov-report=xml --cov-report=term
    
    - name: Test summary
      if: always()
      run: |
        echo "✅ Tests completed"

  deploy:
    name: Deploy to Hugging Face
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        lfs: true
    
    - name: Set up Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
    
    - name: Deploy Combined Space (API + UI)
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE: chetsadaphon66/dog-breed-classifier
      run: |
        git clone https://huggingface:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE hf-space
        cd hf-space
        
        # Copy all files for combined space
        cp ../api.py .
        cp ../app.py .
        cp ../start.sh .
        cp ../Dockerfile.combined Dockerfile
        cp ../requirements.txt .
        mkdir -p models
        cp ../models/resnet34_int8.onnx models/
        cp ../models/resnet34_dog_breeds.json models/
        cp ../models/breed_care_info.json models/
        
        # Update README
        if [ -f ../COMBINED_README.md ]; then
          cp ../COMBINED_README.md README.md
        fi
        
        # Commit and push
        git add .
        git commit -m "Auto-deploy combined API + UI from GitHub Actions" || echo "No changes to commit"
        git push
    
    - name: Deployment summary
      run: |
        echo "✅ Deployed combined space to https://huggingface.co/spaces/chetsadaphon66/dog-breed-classifier"
        echo "🎨 Streamlit UI: Port 7860"
        echo "🚀 FastAPI: Port 8000"
